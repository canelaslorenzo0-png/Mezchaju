name: Build APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build variant (stable = normal release APK)'
        required: true
        default: stable
        type: choice
        options:
          - stable
          - lite
          - arm64-only
          - debug
          - unsigned
          - branded
      brand_name:
        description: 'Branded app label (used when variant = branded)'
        required: false
        default: 'Mezchaju'
        type: string
      brand_accent:
        description: 'Branded accent hex without # (used when variant = branded)'
        required: false
        default: 'FF7849'
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve variant flags
        id: variant
        env:
          VARIANT: ${{ github.event.inputs.variant }}
          BRAND_NAME: ${{ github.event.inputs.brand_name }}
          BRAND_ACCENT: ${{ github.event.inputs.brand_accent }}
        run: |
          V="${VARIANT:-stable}"
          PROPS=()
          case "$V" in
            lite) PROPS+=("-Plite=true") ;;
            arm64-only) PROPS+=("-PonlyArm64=true") ;;
            unsigned) PROPS+=("-Punsigned=true") ;;
            branded) PROPS+=("-PbrandName=${BRAND_NAME}" "-PbrandAccent=${BRAND_ACCENT}") ;;
          esac
          TASK=assembleRelease
          [ "$V" = "debug" ] && TASK=assembleDebug
          {
            echo "task=${TASK}"
            echo "flags=${PROPS[*]:-}"
            echo "variant=${V}"
            echo "stamp=v1.5.0"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build frontend + CLI server
        if: steps.variant.outputs.variant != 'lite'
        working-directory: openclaw-android
        run: |
          npm install --no-audit --no-fund
          npm run build:frontend
          npm run build:cli

      - name: Bundle server into APK assets
        if: steps.variant.outputs.variant != 'lite'
        run: bash android/scripts/build-server-bundle.sh

      - name: Download Termux bootstrap
        run: bash android/scripts/download-bootstrap.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate release keystore
        if: steps.variant.outputs.variant != 'debug'
        run: |
          keytool -genkeypair -v -keystore android/release.keystore \
            -storepass anyclaw-release -alias anyclaw \
            -keypass anyclaw-release -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=AnyClaw, OU=Mobile, O=AnyClaw, L=Internet, ST=Internet, C=US"
          printf 'storeFile=release.keystore\nstorePassword=anyclaw-release\nkeyAlias=anyclaw\nkeyPassword=anyclaw-release\n' > android/key.properties

      - name: Build APK
        working-directory: android
        run: ./gradlew ${{ steps.variant.outputs.task }} ${{ steps.variant.outputs.flags }} --no-daemon

      - name: Rename APK
        id: apk
        run: |
          TASK="${{ steps.variant.outputs.task }}"
          if [ "$TASK" = "assembleDebug" ]; then
            DIR=android/app/build/outputs/apk/debug
          else
            DIR=android/app/build/outputs/apk/release
          fi
          APK=$(find "$DIR" -maxdepth 1 -name "*.apk" | head -n 1)
          V="${{ steps.variant.outputs.variant }}"
          STAMP="${{ steps.variant.outputs.stamp }}"
          if [ "$V" = "stable" ]; then NAME="mezchaju-${STAMP}.apk"; else NAME="mezchaju-${V}-${STAMP}.apk"; fi
          mv "$APK" "$DIR/$NAME"
          echo "apk=$DIR/$NAME" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mezchaju-${{ steps.variant.outputs.variant }}
          path: ${{ steps.apk.outputs.apk }}

      - name: Generate changelog
        if: steps.variant.outputs.variant == 'stable'
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | head -1)
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s" --reverse | head -n 60)
          else
            CHANGES=$(git log --pretty=format:"- %s" --reverse -20)
          fi
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$CHANGES"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub release
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.variant.outputs.stamp }}"
          V="${{ steps.variant.outputs.variant }}"
          APK="${{ steps.apk.outputs.apk }}"
          NAME="${{ steps.apk.outputs.name }}"
          BRAND_NAME="${{ github.event.inputs.brand_name }}"
          BRAND_ACCENT="${{ github.event.inputs.brand_accent }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — attaching $NAME (single release, no spam)."
            gh release upload "$TAG" "$APK" --clobber
            exit 0
          fi

          NOTES="${{ steps.changelog.outputs.notes || '' }}"
          BODY="🦞 **Mezchaju** — OpenClaw + DeepSeek Harness + Claw Code on Android

📱 Install the APK on any ARM64 Android 7.0+ device. No root required.

### v1.5.0
- 🧭 **100% native dashboard (no WebView)** — Kotlin views only, with smooth animated transitions between home, terminals and web UIs
- ⌨️ **Real Termux inside** — every service opens a genuine POSIX PTY shell via Termux terminal-emulator (real bash, real signals, resizing, soft keyboard)
- 📊 Per-service cards: live status, version, port or \`CLI\` badge (CLI agents like \`dsh\` and \`claw\` are on-demand commands, not port listeners — only servers bind ports)
- 🚀 Auto-update terminal: upstream banner → run the update in the service's own terminal → service restarts itself when the shell exits
- 🔓 OpenClaw gateway + Control UI auto-authenticated (no device-token prompt, opens straight into its dashboard)
- 🏠 Home-screen widget: live gateway/Control UI status + one-tap gateway toggle
- 🎛 Custom build variants (lite / arm64-only / debug / unsigned / branded) via workflow dispatch — all attach to this same release
- 🎨 Loading screen animations kept, dead code removed, Codex CLI wrapper dropped

### Changes
${NOTES:-_first stable release_}

---
Branch: ${{ github.ref_name }}
Built from commit ${{ github.sha }}
Variant: ${V}"
          gh release create "$TAG" "$APK" --title "Mezchaju $TAG" --notes "$BODY"
